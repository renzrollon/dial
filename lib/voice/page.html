<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dial voice</title>
<link rel="stylesheet" href="/page.css">
</head>
<body>
<main>
  <h1>Dial voice</h1>
  <p class="purpose">Ask Dial aloud while you work: it checks your repos and answers in a sentence.</p>

  <div class="controls">
    <button type="button" id="start">Start</button>
    <button type="button" id="mute" aria-pressed="false">Mute</button>
    <button type="button" id="stop">Stop</button>
    <button type="button" id="quit">Quit</button>
  </div>

  <p id="status" role="status" tabindex="-1">Not started</p>
  <p id="error" role="alert"></p>
  <p id="notice" aria-live="polite"></p>
  <p id="interim"></p>

  <section id="proposal" aria-labelledby="proposal-heading" hidden>
    <h2 id="proposal-heading">Proposed session</h2>
    <p>Repo: <strong id="proposal-repo"></strong></p>
    <p id="proposal-prompt"></p>
    <p id="proposal-status" aria-live="polite"></p>
    <p id="proposal-reason"></p>
    <div class="controls">
      <button type="button" id="confirm">Confirm</button>
      <button type="button" id="cancel">Cancel</button>
    </div>
  </section>

  <section id="sessions-panel" aria-labelledby="sessions-heading">
    <h2 id="sessions-heading">Sessions</h2>
    <p id="sessions-empty">No sessions started by Dial are running.</p>
    <ul id="sessions"></ul>
  </section>

  <section id="log-panel" aria-labelledby="log-title" hidden>
    <div class="log-head">
      <h2 id="log-title"></h2>
      <button type="button" id="log-close">Close log</button>
    </div>
    <p id="log-reason"></p>
    <pre id="log-lines" tabindex="0"></pre>
  </section>

  <div id="transcript" role="log" aria-label="Transcript">
    <p id="empty">Ask what needs you, or whether a pull request can merge. Try: &quot;what needs me?&quot;</p>
  </div>

  <form id="turn-form" autocomplete="off">
    <label for="turn">Ask Dial</label>
    <input type="text" id="turn" name="turn">
  </form>
</main>
<script type="module" src="/page.js"></script>
</body>
</html>
